<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glint · spot local art</title>
<meta name="description" content="Find, photograph and share local art: painted trash cans, hidden pieces and nature's art.">
<meta name="theme-color" content="#2A2B2E">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Glint">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <div id="map" aria-label="Map of art spots"></div>

  <div class="top">
    <label class="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="sr">Search spots</span>
      <input id="q" type="search" placeholder="Search art, artists, notes" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <button class="geo-note" id="geonote" hidden></button>
  </div>

  <div class="mapctl">
    <button class="round" id="zin" aria-label="Zoom in"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="round" id="zout" aria-label="Zoom out"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button class="round" id="recenter" aria-label="Center on my location"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg></button>
  </div>

  <section id="sheet" aria-labelledby="sheet-title"></section>

  <nav class="tabs" aria-label="Main">
    <button class="tab" id="tab-map" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>Explore</button>
    <button class="capture" id="tab-cap" aria-label="Photograph art"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="tab" id="tab-finds"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Finds</button>
  </nav>

  <div id="overlay"></div>
  <input id="file" type="file" accept="image/*" capture="environment" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
